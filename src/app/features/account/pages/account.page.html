<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Compte</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Compte</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="content">
    <section class="identity">
      @if (profiles.profile()) {
        <div class="avatar" aria-hidden="true">{{ initial() }}</div>
        <div class="who">
          <h2>{{ displayName() }}</h2>
          <p>{{ email() }}</p>
        </div>
        <ion-button fill="clear" shape="round" aria-label="Modifier mon nom" (click)="editName()">
          <ion-icon slot="icon-only" name="pencil" />
        </ion-button>
      } @else if (profiles.error()) {
        <div class="who">
          <h2>Profil indisponible</h2>
          <p>Vérifiez votre connexion.</p>
        </div>
        <ion-button fill="clear" (click)="profiles.reload()">Réessayer</ion-button>
      } @else {
        <ion-skeleton-text class="avatar" [animated]="true" />
        <div class="who">
          <ion-skeleton-text [animated]="true" style="width: 60%; height: 20px" />
          <ion-skeleton-text [animated]="true" style="width: 80%" />
        </div>
      }
    </section>

    <ion-list lines="none">
      <ion-list-header>
        <ion-label>Apparence</ion-label>
      </ion-list-header>
      <ion-segment [value]="theme.preference()" (ionChange)="onThemeChange($event.detail.value)">
        <ion-segment-button value="system"><ion-label>Auto</ion-label></ion-segment-button>
        <ion-segment-button value="light"><ion-label>Clair</ion-label></ion-segment-button>
        <ion-segment-button value="dark"><ion-label>Sombre</ion-label></ion-segment-button>
      </ion-segment>
    </ion-list>

    <ion-button class="sign-out" expand="block" fill="clear" color="danger" (click)="confirmSignOut()">
      <ion-icon slot="start" name="log-out-outline" />
      Se déconnecter
    </ion-button>
  </div>
</ion-content>
