# Android release build (AAB for the Play Store + APK), on demand or for a version tag.
#   - Manual: Actions → "Android build" → Run workflow
#   - Release: git tag v1.0.0 && git push origin v1.0.0  (also attaches the files to a GitHub release)
#
# Optional configuration (Settings → Secrets and variables → Actions):
#   Secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#             → signed build (otherwise unsigned)
#   Variables SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
#             → hosted Supabase (otherwise a test build pointing to the local one)
name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # attach the build to the GitHub release (tags only)

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every upload to the Play Store needs a higher versionCode.
      BREADING_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Capacitor plugins compile with Java 21. The Android SDK is preinstalled on ubuntu runners.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "BREADING_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "BREADING_VERSION_NAME=0.0.${{ github.run_number }}-dev" >> "$GITHUB_ENV"
          fi

      - name: Production Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL not set: test build pointing to the local Supabase."
            exit 0
          fi
          cat > src/environments/environment.prod.ts <<EOF
          // Generated by the Android workflow from the repository variables.
          export const environment = {
            production: true,
            supabase: { url: '$SUPABASE_URL', publishableKey: '$SUPABASE_PUBLISHABLE_KEY' },
          };
          EOF

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key in the secrets: unsigned build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/breading-upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=breading-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: npm run build:android

      - uses: actions/upload-artifact@v4
        with:
          name: breading-android-${{ env.BREADING_VERSION_NAME }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      # The runner is thrown away, but never leave the key around in the workspace.
      - name: Remove signing key
        if: always()
        run: rm -f android/breading-upload.jks android/keystore.properties
